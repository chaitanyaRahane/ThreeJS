<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js App</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
        }
        
        canvas {
            display: block;
        }
        
        .checkbox-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            z-index: 10;
        }
        
        .checkbox-container label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }
        
        .checkbox-container button {
            width: 100%;
            margin-top: 10px;
            padding: 6px 10px;
            background-color: #1e90ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .checkbox-container button:hover {
            background-color: #187bcd;
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>

    <div class="checkbox-container">
        <label><input type="checkbox" class="model-checkbox" value="femur_center"> Femur center</label>
        <label><input type="checkbox" class="model-checkbox" value="hip_center"> Hip center</label>
        <label><input type="checkbox" class="model-checkbox" value="femur_proximalCanal"> Femur Proximal Canal</label>
        <label><input type="checkbox" class="model-checkbox" value="femur_distalCanal"> Femur Distal Canal</label>
        <label><input type="checkbox" class="model-checkbox" value="medial_epicondyle"> Medial Epicondyle</label>
        <label><input type="checkbox" class="model-checkbox" value="lateral_epicondyle"> Lateral Epicondyle</label>
        <label><input type="checkbox" class="model-checkbox" value="distal_medial_pt"> Distal Medial Pt</label>
        <label><input type="checkbox" class="model-checkbox" value="distal_lateral_pt"> Distal Lateral Pt</label>
        <label><input type="checkbox" class="model-checkbox" value="posterior_medial_pt"> Posterior Medial Pt</label>
        <label><input type="checkbox" class="model-checkbox" value="posterior_lateral_pt"> Posterior Lateral Pt</label>

        <button id="updateBtn">Update</button>

        <div style="margin-bottom: 8px; font-weight: bold;">
            Varus / Valgus
        </div>

        <button id="positiveBtn" style="margin-right: 6px;">
            + 
        </button>

        <button id="negativeBtn">
            − 
        </button>

        <div style="margin-bottom: 8px; font-weight: bold;">
            Flexion /Extension
        </div>

        <button id="positiveBtnFlex" style="margin-right: 6px;">
            + 
        </button>

        <button id="negativeBtnFlex">
            − 
        </button>

        <div id="distanceDisplayMedialPt" style="position:absolute; top:600px; right: 10px; left:10px; color:white;"></div>
        <div id="distanceDisplayLateralPt" style="position:absolute; top:650px; right: 10px; left:10px; color:white;"></div>

        <button id="toggleClipping" style="position:absolute; top:550px; right:15px; z-index:10;">
            Resect
            </button>

    </div>



    <script type="module" src="/main.ts"></script>
</body>

</html>
